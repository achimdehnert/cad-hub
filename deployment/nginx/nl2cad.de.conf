# ===========================================================================
# Nginx — nl2cad.de (CAD Hub)
# Port: 8094 (docker-compose.prod.yml)
# SSL: managed by Certbot / Let's Encrypt
# ===========================================================================

server {
    listen 80;
    server_name nl2cad.de www.nl2cad.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name nl2cad.de www.nl2cad.de;

    ssl_certificate     /etc/letsencrypt/live/nl2cad.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nl2cad.de/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 100M;

    # Static files
    location /static/ {
        alias /opt/cad-hub/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Media files (IFC uploads)
    location /media/ {
        alias /opt/cad-hub/media/;
        expires 7d;
    }

    # Django app
    location / {
        proxy_pass         http://127.0.0.1:8094;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
