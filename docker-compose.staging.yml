# cad-hub — Staging Docker Compose
# Domain: staging-cadhub.iil.pet (ADR-212 Klausel 3, Traefik-Ingress)
# Routing: Cloudflare bf-staging Tunnel → Traefik (178.104.184.168) → container:8000

services:
  migrate:
    image: ghcr.io/achimdehnert/cad-hub:${IMAGE_TAG:-latest}
    entrypoint: ["python", "manage.py", "migrate", "--noinput", "--skip-checks"]
    env_file: .env.staging
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cad_hub_staging_network
    restart: "no"
    deploy:
      restart_policy:
        condition: none
      resources:
        limits:
          memory: 256M

  web:
    image: ghcr.io/achimdehnert/cad-hub:${IMAGE_TAG:-latest}
    container_name: cad_hub_staging_web
    command: ["web"]
    env_file: .env.staging
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    networks:
      - cad_hub_staging_network
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_public"
      - "traefik.http.routers.cadhub-staging.rule=Host(`staging-cadhub.iil.pet`)"
      - "traefik.http.routers.cadhub-staging.entrypoints=websecure"
      - "traefik.http.routers.cadhub-staging.tls.certresolver=letsencrypt"
      - "traefik.http.services.cadhub-staging.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/livez/')"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  db:
    image: postgres:16-alpine
    container_name: cad_hub_staging_db
    restart: unless-stopped
    env_file: .env.staging
    volumes:
      - cad_hub_staging_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cad_hub_staging_network
    shm_size: 64m
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  cad_hub_staging_pgdata:

networks:
  cad_hub_staging_network:
    driver: bridge
  traefik_public:
    external: true
