# cad-hub — Staging Docker Compose
# Domain: staging.nl2cad.de | Port: 8194

services:
  cad-hub-staging-db:
    image: postgres:16-alpine
    container_name: cad_hub_staging_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cad_hub_staging
      POSTGRES_USER: cad_hub_staging
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - cad_hub_staging_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cad_hub_staging -d cad_hub_staging"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 64m
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - cad_hub_staging_net

  cad-hub-staging-migrate:
    image: ghcr.io/achimdehnert/cad-hub/cad-hub-web:${IMAGE_TAG:-latest}
    container_name: cad_hub_staging_migrate
    env_file: .env.staging
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    entrypoint: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      cad-hub-staging-db:
        condition: service_healthy
    networks:
      - cad_hub_staging_net
    restart: "no"
    deploy:
      restart_policy:
        condition: none
      resources:
        limits:
          memory: 256M

  cad-hub-staging-web:
    image: ghcr.io/achimdehnert/cad-hub/cad-hub-web:${IMAGE_TAG:-latest}
    container_name: cad_hub_staging_web
    restart: unless-stopped
    env_file: .env.staging
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    ports:
      - "127.0.0.1:8194:8000"
    depends_on:
      cad-hub-staging-migrate:
        condition: service_completed_successfully
      cad-hub-staging-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/livez/')\""]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - cad_hub_staging_net

volumes:
  cad_hub_staging_pgdata:

networks:
  cad_hub_staging_net:
    driver: bridge
