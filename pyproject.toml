[project]
name = "cad-hub"
version = "0.1.0"
description = "CAD Hub — IFC/DXF Analysis, Fire Safety, Tendering Platform"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}
authors = [{name = "Achim Dehnert"}]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["vendor/", ".venv/", "*/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501", "E402", "F821", "F401", "E741", "E722"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["E501", "I001", "E402", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["config", "apps"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.base"
python_files = ["tests.py", "test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short -q"
