# =============================================================================
# I1 Spec-first artifact — Klickdummy Bauantrag-Vorprüfung für Einreicher (cad-hub)
# Modus A, class=mock. Grundlage: cad-hub#72 (K4), cad-hub#77 (Scope-Erweiterung
# Einreicher-Vorprüfung); fachlich BauVorlV §§ 3, 7, 8, 9 (bedingter Pflichtkatalog).
# Dieses Repo ist ÖFFENTLICH — keine Haus-, Personen- oder Herstellernamen.
# =============================================================================

$schema: https://raw.githubusercontent.com/achimdehnert/platform/main/packages/iil-klickdummy/src/iil_klickdummy/schemas/screens-spec.schema.json
spec_id: cad-hub:klickdummy-spec-bauantrag-vorpruefung
spec_version: "0.3"
spec_schema_version: "1.1"
spec_date: "2026-09-24"
title: "Bauantrag-Vorprüfung für Einreicher — Klickdummy (K1, #77) · v0.3 Antragsteller-Prozess (Vorhaben, Formular-Download, Unterlagen-Feedback, Freigabe, Bauamt-Rückmeldung, Nachbesserung)"

adr:
  local: cad-hub:ADR-036
  conforms_to: platform:ADR-211
  sister_of: [cad-hub:ADR-035]

class: mock
class_evidence:
  no_backend: true
  no_demo_param: true
  target_mocks_visible: true
  systemgrenzen:
    - "Landes-Antragsassistent"
    - "Fachverfahren-Adapter"
    - "Prüfkern"

off_ramp:
  policy: platform:ADR-211 Static→Echt-Migrationspfad
  unit: per-screen
  rule: "Parity-grün pro Screen ⇒ Screen aus statischer Quelle entfernen"
  doppelquell_grenze: prod-release
  parity_runner: make klickdummy-i3

grounding:
  konzept: >-
    cad-hub#72 (K4 Vorgangsmodell) und cad-hub#77 (Scope-Erweiterung: Vorprüfung
    vor Einreichung durch den Entwurfsverfasser statt durch die Sachbearbeitung).
    Fachliche Grundlage: Bayerische Bauvorlagenverordnung (BauVorlV) §§ 3, 7, 8, 9
    — der Pflichtkatalog ist an Verfahrensart, Bebauungsplan-Gebiet, Erschließung
    und Abstandsflächenübernahme gebunden, keine feste Liste.
  pilot: >-
    Freiwilliger Vorab-Dienst für Entwurfsverfasser/Bauherr vor der verbindlichen
    Einreichung im landesweiten Online-Antragsassistenten; schreibt nichts in ein
    Fachverfahren und ersetzt den Landes-Assistenten nicht. Pilot-Kontext (Behörde)
    nicht-öffentlich, siehe #77.

personas:
  antragsteller:
    label: "Antragsteller/in (Bauherr oder Bevollmächtigte/r)"
    rolle: einreicher
    sieht: [vorhaben_anlegen, vorhabensseite, upload, unterlagen_feedback, rueckmeldung, fehlliste, bericht]
  entwurfsverfasser:
    label: "Entwurfsverfasser/in (Einreicher)"
    rolle: einreicher
    sieht: [vorhaben_anlegen, vorhabensseite, upload, unterlagen_feedback, rueckmeldung, sortierung, fehlliste, formpruefung, bericht]
  sachbearbeitung:
    label: "Sachbearbeitung (Bauamt)"
    rolle: sachbearbeitung
    sieht: [pruefung_bauamt, bericht]

screens:
  # ---- Antragsteller-Einstieg auf der Seite der Bauaufsichtsbehörde (v0.2, Owner 2026-09-24) ----
  - id: vorhaben_anlegen
    title: "Neues Bauvorhaben anlegen"
    personas: [antragsteller, entwurfsverfasser]
    purpose: >-
      Der Antragsteller kommt über die Seite der Bauaufsichtsbehörde (Landratsamt),
      wählt sein Vorhaben aus einer festen Liste der Vorhabensarten, macht wenige
      Grundangaben und erhält beim Anlegen eine Vorhabensnummer — der Anker für alle
      weiteren Schritte. Kein Login, keine Einreichung, kein Fachverfahren.
    datafields:
      - { name: vorhabensart, type: enum, source: mock-demo, semantic: "Auswahl aus fester Liste: neubau_wohngebaeude | anbau_umbau | nutzungsaenderung | garage_carport | abbruch | werbeanlage | sonderbau | vorbescheid — kein Freitext" }
      - { name: verfahrensart, type: enum, source: mock-demo, semantic: "aus der Vorhabensart vorgeschlagen (genehmigungsfreistellung | vereinfachtes_verfahren | sonderbau), vom Antragsteller änderbar" }
      - { name: gemeinde, type: enum, source: mock-demo, semantic: "Gemeinde im Zuständigkeitsbereich der Behörde (Mock-Liste, erfundene Namen)" }
      - { name: flurstueck, type: string, source: mock-demo, semantic: "Gemarkung/Flurstück, erfunden; dient nur der Konsistenzprüfung in formpruefung" }
      - { name: bedingungen, type: object, source: mock-demo, semantic: "im_bplan_gebiet, oeffentlich_erschlossen, abstandsflaechenuebernahme_noetig — je bool; steuern mit der Verfahrensart den Pflichtkatalog (BauVorlV §3)" }
      - { name: vorhabensnummer, type: string, source: mock-demo, semantic: "beim Anlegen vergeben, Format BV-<Jahr>-<6 Ziffern>; im Mock ein fester Demo-Wert, kein Zähler" }
    target_mocks:
      - "Prüfkern"
    parity_acceptance:
      - id: vorhaben_anlegen.liste_statt_freitext
        check: "Die Vorhabensart wird aus einer festen Liste gewählt (Auswahlfeld), es gibt kein Freitextfeld dafür"
        kind: behavioral-manual
      - id: vorhaben_anlegen.verfahrensart_vorgeschlagen
        check: "Nach Wahl der Vorhabensart ist eine Verfahrensart vorbelegt und bleibt änderbar; der Screen sagt, dass der Vorschlag keine Rechtsauskunft ist"
        kind: behavioral-manual
      - id: vorhaben_anlegen.nummer_nach_anlegen
        check: "Erst nach 'Vorhaben anlegen' erscheint eine Vorhabensnummer im Format BV-<Jahr>-<6 Ziffern>; vor dem Anlegen ist keine Nummer sichtbar"
        kind: behavioral-manual
      - id: vorhaben_anlegen.keine_einreichung
        check: "Der Screen weist sichtbar aus, dass das Anlegen eines Vorhabens keine Einreichung ist und nichts in ein Fachverfahren schreibt"
        kind: behavioral-manual
    off_ramp_status: static

  - id: vorhabensseite
    title: "Vorhabensseite"
    route: "/vorhaben/{vorhabensnummer}"
    route_example: "/vorhaben/BV-2026-000123"
    personas: [antragsteller, entwurfsverfasser]
    purpose: >-
      Die Seite zum Vorhaben: Nummer und Grunddaten, der aus Vorhabensart und
      Bedingungen abgeleitete Katalog der benötigten Anträge und Vorlagen mit
      Download je Formular und als Sammel-Download, der Status des Vorhabens und
      der Einstieg in den Upload der ausgefüllten Anträge. Wiederaufruf über die
      Vorhabensnummer, solange die Löschfrist läuft.
    datafields:
      - { name: vorhabensnummer, type: string, source: mock-demo, semantic: "aus vorhaben_anlegen; zugleich Aufruf-Schlüssel der Seite" }
      - { name: stammdaten, type: object, source: mock-demo, semantic: "vorhabensart, verfahrensart, gemeinde, flurstueck, bedingungen — aus vorhaben_anlegen übernommen, hier änderbar" }
      - { name: status, type: enum, source: mock-demo, semantic: "angelegt | unterlagen_hochgeladen | vorgeprueft | zur_pruefung_freigegeben | rueckmeldung_liegt_vor | erneut_freigegeben — der Landes-Zustand 'eingereicht' wird hier nie gesetzt" }
      - { name: runde, type: integer, source: mock-demo, semantic: "Nummer der Prüfrunde (1 = erste Freigabe; jede Nachbesserung mit erneuter Freigabe zählt hoch)" }
      - { name: nachrichten, type: array, source: mock-demo, semantic: "chronologische Ereignisse zum Vorhaben (angelegt, hochgeladen, freigegeben, Rückmeldung des Bauamts liegt vor); der jüngste Eintrag verlinkt auf rueckmeldung" }
      - { name: soll_katalog, type: array, source: mock-demo, semantic: "je Zeile: bezeichnung, formular_id, pflicht (pflicht|bedingt), bedingung, download (Einzel-Attrappe)" }
      - { name: sammel_download, type: object, source: mock-demo, semantic: "ZIP-Attrappe mit genau den Formularen des aktuell zutreffenden Katalogs; Inhaltsliste sichtbar" }
      - { name: loeschfrist_tage, type: integer, source: mock-demo, semantic: "Tage bis zur Löschung des Vorhabens samt Unterlagen ohne weitere Aktivität" }
    target_mocks:
      - "Prüfkern"
      - "Landes-Antragsassistent"
    parity_acceptance:
      - id: vorhabensseite.katalog_folgt_vorhaben
        check: "Der angezeigte Formular-Katalog enthält nur die laut Vorhabensart, Verfahrensart und Bedingungen zutreffenden Anträge und Vorlagen; bedingte Zeilen nennen ihre Bedingung"
        kind: behavioral-manual
      - id: vorhabensseite.download_einzeln_und_gesamt
        check: "Jedes Formular hat einen eigenen Download, zusätzlich gibt es einen Sammel-Download als ZIP-Attrappe, dessen Inhaltsliste genau dem angezeigten Katalog entspricht"
        kind: behavioral-manual
      - id: vorhabensseite.status_sichtbar
        check: "Der Status des Vorhabens ist sichtbar und folgt der Kette angelegt → hochgeladen → vorgeprüft → zur Prüfung freigegeben → Rückmeldung liegt vor → erneut freigegeben; der Landes-Zustand 'eingereicht' wird hier nie gesetzt"
        kind: behavioral-manual
      - id: vorhabensseite.nachricht_zur_rueckmeldung
        check: "Liegt eine Rückmeldung des Bauamts vor, zeigt die Vorhabensseite eine Nachricht mit Runde und Datum, die direkt zur Rückmeldung je Antragselement führt"
        kind: behavioral-manual
      - id: vorhabensseite.wiederaufruf_per_nummer
        check: "Die Seite zeigt, wie sie über die Vorhabensnummer erneut aufgerufen wird, und nennt die Löschfrist, nach der Nummer und Unterlagen verfallen"
        kind: behavioral-manual
      - id: vorhabensseite.weiter_zum_upload
        check: "Von der Vorhabensseite führt genau ein Schritt zum Upload der ausgefüllten Anträge, der das Vorhaben (Nummer, Verfahrensart, Bedingungen) bereits kennt"
        kind: behavioral-manual
    off_ramp_status: static

  - id: upload
    title: "Anträge und PDF-Satz hochladen"
    personas: [antragsteller, entwurfsverfasser]
    purpose: >-
      Der Einreicher lädt die ausgefüllten Anträge und den PDF-Satz zum Vorhaben
      hoch; Verfahrensart und Bedingungen sind aus dem Vorhaben übernommen und
      werden dort geändert, nicht hier — vor jeder verbindlichen Einreichung, mit
      sichtbarer Löschfrist.
    datafields:
      - { name: vorhabensnummer, type: string, source: mock-demo, semantic: "aus vorhabensseite; jeder Upload gehört zu genau einem Vorhaben" }
      - { name: dateien, type: array, source: mock-demo, semantic: "Liste der in einem Schritt hochgeladenen PDF-Dateinamen (Mehrfachauswahl oder Ablegen eines ganzen Satzes); jede Vorlage als eigene PDF, keine Anhänge innerhalb der PDF" }
      - { name: verfahrensart, type: enum, source: mock-demo, semantic: "genehmigungsfreistellung | vereinfachtes_verfahren | sonderbau — aus dem Vorhaben übernommen, hier nur angezeigt" }
      - { name: bedingungen, type: object, source: mock-demo, semantic: "im_bplan_gebiet, oeffentlich_erschlossen, abstandsflaechenuebernahme_noetig — je bool, aus dem Vorhaben übernommen, hier nur angezeigt" }
      - { name: loeschfrist_tage, type: integer, source: mock-demo, semantic: "Anzahl Tage bis zur automatischen Löschung der Unterlagen" }
    target_mocks:
      - "Prüfkern"
    parity_acceptance:
      - id: upload.vorhaben_bindung
        check: "Der Screen zeigt die Vorhabensnummer sowie Verfahrensart und Bedingungen aus dem Vorhaben als übernommene Werte mit einem Verweis 'auf der Vorhabensseite ändern' — sie werden hier nicht neu erfasst"
        kind: behavioral-manual
      - id: upload.nur_pdf
        check: "Nur PDF-Dateien werden akzeptiert; andere Formate oder Dateianlagen innerhalb der PDF lösen eine Fehlermeldung aus"
        kind: behavioral-manual
      - id: upload.mehrere_auf_einmal
        check: "Mehrere PDF-Dateien lassen sich in einem Schritt hochladen (Mehrfachauswahl im Dateidialog und Ablegen eines ganzen Satzes); alle erscheinen in der Dateiliste, bevor der Nutzer fortfährt"
        kind: behavioral-manual
      - id: upload.keine_einreichung
        check: "Der Screen weist sichtbar aus, dass hier keine verbindliche Einreichung erfolgt, sondern nur eine freiwillige Vorprüfung"
        kind: behavioral-manual
      - id: upload.loeschfrist_sichtbar
        check: "Die Löschfrist (in Tagen) ist sichtbar angezeigt, bevor der Nutzer fortfährt"
        kind: behavioral-manual
      - id: upload.bedingungen_erfassbar
        check: "Verfahrensart und alle drei Bedingungen sind vor dem Weiter sichtbar (seit v0.2 aus dem Vorhaben übernommen; die Erfassung selbst liegt auf vorhaben_anlegen/vorhabensseite)"
        kind: behavioral-manual
    off_ramp_status: static

  # ---- Feedback-Schleife (v0.3, Owner 2026-09-24): Unterlagen-Feedback → Freigabe → Bauamt → Rückmeldung → Nachbesserung ----
  - id: unterlagen_feedback
    title: "Unterlagen-Feedback und Freigabe"
    personas: [antragsteller, entwurfsverfasser]
    purpose: >-
      Direkt nach dem Hochladen erhält der Antragsteller je Unterlage ein Feedback des
      Prüfkerns: komplett, notwendige Angaben fehlen (welche), oder keiner Vorlagenart
      zugeordnet. Von hier gibt er die Unterlagen mit „Unterlagen einreichen" zur Prüfung
      durch das Bauamt frei — das ist die Freigabe an den Vorab-Dienst der Behörde, nicht
      die verbindliche Einreichung im Landes-Assistenten.
    datafields:
      - { name: vorhabensnummer, type: string, source: mock-demo, semantic: "aus vorhabensseite" }
      - { name: unterlagen, type: array, source: mock-demo, semantic: "je Zeile: dateiname, zugeordnet_als (Vorlagenart oder 'nicht zugeordnet'), status (komplett | unvollstaendig | nicht_zugeordnet), fehlende_angaben (Liste), details_link (sortierung|fehlliste|formpruefung)" }
      - { name: katalog_luecken, type: array, source: mock-demo, semantic: "Katalogpunkte ohne zugehörige Unterlage (aus fehlliste), damit die Freigabe die Lücke ausweist" }
      - { name: freigabe, type: object, source: mock-demo, semantic: "Aktion 'Unterlagen einreichen' → status zur_pruefung_freigegeben, runde +1; mit Warnung, wenn unvollständige Unterlagen dabei sind" }
    target_mocks:
      - "Prüfkern"
    parity_acceptance:
      - id: unterlagen_feedback.status_je_unterlage
        check: "Jede hochgeladene Unterlage trägt genau einen Status (komplett, unvollständig oder nicht zugeordnet); bei 'unvollständig' sind die fehlenden Angaben je Unterlage konkret benannt"
        kind: behavioral-manual
      - id: unterlagen_feedback.details_verlinkt
        check: "Von jeder Zeile führt ein Link zu den Detail-Screens (Sortierung, Vollständigkeit, Formprüfung); die Detail-Screens bleiben für Entwurfsverfasser erreichbar"
        kind: behavioral-manual
      - id: unterlagen_feedback.freigabe_ist_nicht_landes_einreichung
        check: "Der Button 'Unterlagen einreichen' ist als Freigabe zur Prüfung durch das Bauamt (Vorab-Dienst) beschriftet und erklärt, dass die verbindliche Einreichung im Landes-Assistenten ein eigener Schritt bleibt"
        kind: behavioral-manual
      - id: unterlagen_feedback.freigabe_mit_luecken_warnt
        check: "Sind Unterlagen unvollständig oder Katalogpunkte ohne Unterlage, warnt der Screen vor der Freigabe sichtbar (Anzahl), verhindert sie aber nicht"
        kind: behavioral-manual
    off_ramp_status: static

  - id: pruefung_bauamt
    title: "Prüfung durch das Bauamt"
    route: "/bauamt/vorhaben/{vorhabensnummer}/pruefung"
    route_example: "/bauamt/vorhaben/BV-2026-000123/pruefung"
    login_required: true
    personas: [sachbearbeitung]
    purpose: >-
      Die Sachbearbeitung sieht die freigegebenen Unterlagen eines Vorhabens mit dem
      automatischen Feedback und gibt je Einzelanlage ein eigenes Urteil mit Hinweistext.
      „Prüfung abschließen" schließt die Runde ab und benachrichtigt den Antragsteller.
      Weiterhin Vorab-Dienst: kein Bescheid, kein Fachverfahren.
    datafields:
      - { name: vorhabensnummer, type: string, source: mock-demo, semantic: "Kopf; dazu Vorhabensart, Verfahrensart, Runde, Freigabedatum" }
      - { name: unterlagen, type: array, source: mock-demo, semantic: "je Zeile: bezeichnung/dateiname, status_automatisch, urteil_bauamt (in_ordnung | nachbesserung | nicht_erforderlich), hinweis (Freitext), bearbeitet_von (Rolle, kein Name)" }
      - { name: abschluss, type: object, source: mock-demo, semantic: "Aktion 'Prüfung abschließen' → status rueckmeldung_liegt_vor, Nachricht an den Antragsteller (Attrappe)" }
    target_mocks:
      - "Prüfkern"
      - "Fachverfahren-Adapter"
    parity_acceptance:
      - id: pruefung_bauamt.urteil_je_einzelanlage
        check: "Je Unterlage gibt es ein eigenes Bauamt-Urteil (in Ordnung, Nachbesserung, nicht erforderlich) mit Hinweistext; es gibt kein pauschales Gesamturteil ohne Zeilen"
        kind: behavioral-manual
      - id: pruefung_bauamt.automatik_sichtbar_getrennt
        check: "Das automatische Feedback des Prüfkerns steht je Zeile sichtbar neben dem Bauamt-Urteil und wird von ihm nicht überschrieben"
        kind: behavioral-manual
      - id: pruefung_bauamt.abschluss_benachrichtigt
        check: "'Prüfung abschließen' ist als Abschluss der Runde erkennbar und kündigt die Nachricht an den Antragsteller an (Attrappe, kein Versand); nichts wird in ein Fachverfahren geschrieben"
        kind: behavioral-manual
      - id: pruefung_bauamt.kein_bescheid
        check: "Der Screen weist aus, dass die Rückmeldung eine Vorprüfung ist und kein Bescheid, keine Zulässigkeitsentscheidung"
        kind: behavioral-manual
    off_ramp_status: static

  - id: rueckmeldung
    title: "Rückmeldung des Bauamts je Antragselement"
    route: "/vorhaben/{vorhabensnummer}/rueckmeldung"
    route_example: "/vorhaben/BV-2026-000123/rueckmeldung"
    personas: [antragsteller, entwurfsverfasser]
    purpose: >-
      Nach Abschluss der Prüfung erhält der Antragsteller eine Nachricht und sieht auf der
      Vorhabensseite die Rückmeldung je Antragselement: Urteil und Hinweis des Bauamts neben
      dem automatischen Status. Er ersetzt nachzubessernde Unterlagen, ergänzt fehlende und
      gibt erneut frei — die nächste Runde.
    datafields:
      - { name: vorhabensnummer, type: string, source: mock-demo, semantic: "Kopf; dazu Runde und Abschlussdatum der Prüfung" }
      - { name: nachricht, type: object, source: mock-demo, semantic: "Benachrichtigung (E-Mail-Attrappe): Betreff mit Vorhabensnummer, Kurztext, Link zur Vorhabensseite — enthält keine Prüfinhalte" }
      - { name: elemente, type: array, source: mock-demo, semantic: "je Antragselement: bezeichnung, status_automatisch, urteil_bauamt, hinweis, aktion (ersetzen | ergaenzen | keine)" }
      - { name: erneut_freigeben, type: object, source: mock-demo, semantic: "Aktion 'Erneut einreichen' → status erneut_freigegeben, runde +1; nur sinnvoll, wenn mindestens ein Element geändert wurde" }
    target_mocks:
      - "Prüfkern"
    parity_acceptance:
      - id: rueckmeldung.je_antragselement
        check: "Die Rückmeldung ist je Antragselement aufgeschlüsselt (Urteil, Hinweis, automatischer Status), nicht nur als Gesamttext"
        kind: behavioral-manual
      - id: rueckmeldung.nachricht_ohne_inhalt
        check: "Die Nachricht an den Antragsteller nennt Vorhabensnummer und Link, aber keine Prüfinhalte — die stehen nur auf der Vorhabensseite"
        kind: behavioral-manual
      - id: rueckmeldung.aktion_je_element
        check: "Jedes Element mit Urteil 'Nachbesserung' oder ohne Unterlage bietet eine Aktion (ersetzen bzw. ergänzen), die zum Upload dieses Vorhabens führt"
        kind: behavioral-manual
      - id: rueckmeldung.erneute_freigabe_zaehlt_runde
        check: "'Erneut einreichen' ist als neue Runde erkennbar (Rundenzähler) und führt zurück in die Prüfung durch das Bauamt; die Landes-Einreichung bleibt davon unberührt"
        kind: behavioral-manual
    off_ramp_status: static

  # ---- Detail-Screens (v0.1), aus unterlagen_feedback verlinkt ----
  - id: sortierung
    title: "Dokumente sortieren"
    personas: [entwurfsverfasser]
    purpose: >-
      Je hochgeladener Datei wird die erkannte Vorlagenart mit Konfidenz gezeigt;
      Sammeldateien lassen sich aufteilen, Fehlerkennungen lassen sich korrigieren.
    datafields:
      - { name: dokumente, type: array, source: mock-demo, semantic: "je Eintrag: dateiname, vorlagenart, konfidenz, seiten" }
    target_mocks:
      - "Prüfkern"
    parity_acceptance:
      - id: sortierung.vorlagenart_konfidenz
        check: "Jede Datei zeigt eine erkannte Vorlagenart mit Konfidenz-Wert"
        kind: behavioral-manual
      - id: sortierung.korrektur_moeglich
        check: "Der Nutzer kann die erkannte Vorlagenart je Datei manuell korrigieren"
        kind: behavioral-manual
      - id: sortierung.sammeldatei_aufteilung
        check: "Eine als Sammeldatei erkannte Datei (mehrere Vorlagen in einer PDF) bietet eine Aufteilen-Aktion an; das Ergebnis zeigt je Teil Seitenbereich, erkannte Vorlagenart mit Konfidenz und neuen Dateinamen, ein Teil kann 'Unbekannt' bleiben, und die Aufteilung lässt sich übernehmen"
        kind: behavioral-manual
    off_ramp_status: static

  - id: fehlliste
    title: "Vollständigkeit: Fehlliste gegen Soll-Katalog"
    personas: [antragsteller, entwurfsverfasser]
    purpose: >-
      Die Soll-Liste ergibt sich aus Verfahrensart und Bedingungen (bedingter
      Katalog nach BauVorlV §3) und wird gegen die sortierten Dokumente geprüft;
      je Zeile ein Status mit Begründung, die Summe ist aus den Zeilen berechnet.
    datafields:
      - { name: katalogpunkte, type: array, source: mock-demo, semantic: "je Zeile: bezeichnung, bedingung, status (vorhanden|fehlt|unklar), begruendung" }
    target_mocks:
      - "Prüfkern"
    parity_acceptance:
      - id: fehlliste.bedingter_katalog
        check: "Die Soll-Liste zeigt nur die laut Verfahrensart und Bedingungen tatsächlich zutreffenden Katalogpunkte (z. B. Standsicherheitsnachweis nur bei Sonderbau)"
        kind: behavioral-manual
      - id: fehlliste.status_je_zeile
        check: "Jede Zeile trägt genau einen Status (vorhanden, fehlt oder unklar) mit Begründung, nie eine pauschale Unvollständigkeits-Wertung"
        kind: behavioral-manual
      - id: fehlliste.aggregat_berechnet
        check: "Die Kennzahl 'n fehlt von m' wird zur Laufzeit aus den angezeigten Zeilen ermittelt (CSS-Zähler über data-status), steht nicht als fester Text im Markup"
        kind: behavioral-manual
      - id: fehlliste.status_zurueck_zum_vorhaben
        check: "Die Fehlliste nennt die Vorhabensnummer und bietet den Rückweg zur Vorhabensseite, deren Status danach 'vorgeprüft' zeigt; fehlende Formulare verweisen auf ihren Download dort"
        kind: behavioral-manual
    off_ramp_status: static

  - id: formpruefung
    title: "Formprüfung je Vorlagenart"
    personas: [entwurfsverfasser]
    purpose: >-
      Je Vorlagenart werden die formalen Pflichtmerkmale mit Vorhandensein,
      Konfidenz und Fundort geprüft, dazu die Konsistenz von Bauherr, Flurstück
      und Adresse über alle Dokumente — ausdrücklich ohne Zulässigkeitsprüfung.
    datafields:
      - { name: merkmale, type: array, source: mock-demo, semantic: "je Merkmal: vorlagenart, merkmal, vorhanden, konfidenz, fundort_seite" }
      - { name: konsistenz, type: object, source: mock-demo, semantic: "bauherr, flurstueck, adresse — Übereinstimmung über alle Dokumente" }
    target_mocks:
      - "Prüfkern"
    parity_acceptance:
      - id: formpruefung.merkmal_konfidenz_fundort
        check: "Jedes geprüfte Merkmal zeigt Vorhandensein, Konfidenz und Fundort (Seite)"
        kind: behavioral-manual
      - id: formpruefung.hausregel_gekennzeichnet
        check: "Die Maßstabsleiste ist ausdrücklich als Anforderung der Behörde gekennzeichnet, nicht als BauVorlV-Pflicht"
        kind: behavioral-manual
      - id: formpruefung.keine_zulaessigkeit
        check: "Der Screen weist sichtbar aus, dass nur Vorhandensein und Übereinstimmung geprüft werden, nie Zulässigkeit (kein Abstandsflächen-Urteil)"
        kind: behavioral-manual
      - id: formpruefung.konsistenz_ueber_dokumente
        check: "Bauherr, Flurstück und Adresse werden über alle Dokumente hinweg auf Übereinstimmung geprüft, nicht nur je Einzeldokument"
        kind: behavioral-manual
    off_ramp_status: static

  - id: bericht
    title: "Ergebnisbericht"
    personas: [antragsteller, entwurfsverfasser, sachbearbeitung]
    purpose: >-
      Zusammenfassender Hinweisbericht mit Konfidenzen, Download als PDF-Attrappe,
      Weiterleitung zum echten Landes-Antragsassistenten als reine Link-Attrappe,
      Hinweis auf Löschung nach Frist und optionale Weitergabe an die Sachbearbeitung.
    datafields:
      - { name: vorhabensnummer, type: string, source: mock-demo, semantic: "aus vorhabensseite; Kopfzeile des Berichts" }
      - { name: hinweise, type: array, source: mock-demo, semantic: "aggregiert aus fehlliste + formpruefung, je Hinweis mit Konfidenz" }
      - { name: loeschfrist_tage, type: integer, source: mock-demo, semantic: "aus Screen upload übernommen" }
      - { name: weitergabe_an_sachbearbeitung, type: boolean, source: mock-demo, semantic: "optionale Aktion, Default aus" }
    target_mocks:
      - "Prüfkern"
      - "Landes-Antragsassistent"
    parity_acceptance:
      - id: bericht.hinweisliste_mit_konfidenz
        check: "Der Bericht listet alle Hinweise mit Konfidenz, aggregiert aus Fehlliste und Formprüfung"
        kind: behavioral-manual
      - id: bericht.weiter_ist_attrappe
        check: "Der Button 'Weiter zum Antragsassistenten des Landes' ist erkennbar eine Attrappe ohne echtes Ziel und schreibt nichts in ein Fachverfahren"
        kind: behavioral-manual
      - id: bericht.loeschung_nach_frist
        check: "Der Hinweis auf Löschung nach Ablauf der Frist zeigt die in Screen 'upload' gewählte Frist"
        kind: behavioral-manual
      - id: bericht.weitergabe_optional
        check: "Die Weitergabe des Berichts an die Sachbearbeitung ist als optionale, nicht automatische Aktion erkennbar"
        kind: behavioral-manual
    off_ramp_status: static
