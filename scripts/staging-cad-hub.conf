# Nginx config: staging.nl2cad.de → cad-hub staging (port 8100)

server {
    listen 80;
    listen [::]:80;
    server_name staging.nl2cad.de;
    return 301 https://staging.nl2cad.de$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.nl2cad.de;

    ssl_certificate /etc/letsencrypt/live/staging.nl2cad.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.nl2cad.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }
}
