# REFLEX Configuration — cad-hub
# ADR-162: Reflexive Evidence-based Loop for UI Development
# ADR-163: Tier 1 — Full Reflex

hub_name: cad-hub
vertical: general

domain_keywords:
  - IFC
  - DXF
  - CAD
  - BIM
  - Brandschutz
  - AVB
  - Ausschreibung

quality:
  min_acceptance_criteria: 2
  max_uc_steps: 7
  require_error_cases: true
  require_specific_actor: true
  forbid_implementation_details: true
  forbid_soft_language: true

viewports:
  - name: desktop
    width: 1280
    height: 800
  - name: tablet
    width: 768
    height: 1024
  - name: mobile
    width: 375
    height: 812

htmx_patterns:
  banned:
    - hx-boost
  required_on_forms:
    - hx-indicator
    - hx-disabled-elt

permissions_matrix:
  /:
    admin: 200
    viewer: 200
    anonymous: 200
  /ifc/:
    admin: 200
    viewer: 200
    anonymous: 302
  /dxf/:
    admin: 200
    viewer: 200
    anonymous: 302
  /brandschutz/:
    admin: 200
    viewer: 200
    anonymous: 302
  /avb/:
    admin: 200
    viewer: 200
    anonymous: 302
  /api/registry/modules/:
    admin: 200
    viewer: 200
    anonymous: 302
  /admin/:
    admin: 200
    viewer: 302
    anonymous: 302

test_users:
  admin:
    username: admin
    password: "<test-password>"
  viewer:
    username: viewer
    password: "<test-password>"
  # TODO: Set actual test credentials

dev_cycle:
  base_url: http://localhost:8094
  login_url: /accounts/login/
  backend_test_cmd: "pytest tests/ -q --tb=short"
  lint_cmd: "ruff check apps/ config/"
  max_fix_iterations: 3
  public_routes:
    - /accounts/login/
    - /livez/
    - /healthz/

test_routes:
  - url: /livez/
    expect: 200
    auth: false
    label: Liveness
  - url: /healthz/
    expect: 200
    auth: false
    label: Readiness
  - url: /login/
    expect: 200
    auth: false
    label: Login Page
  - url: /
    expect: 200
    auth: false
    label: Landing Page
  - url: /ifc/
    expect: 200
    auth: true
    label: IFC Dashboard
  - url: /brandschutz/
    expect: 200
    auth: true
    label: Brandschutz Dashboard
  - url: /avb/
    expect: 200
    auth: true
    label: AVB Dashboard
  - url: /api/registry/modules/
    expect: 200
    auth: true
    label: Registry Modules
