# CAD Hub - CD Production Pipeline
# Deploys via self-hosted runner on Hetzner server (same pattern as risk-hub)

name: Deploy Production

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Hetzner
    runs-on: [self-hosted, hetzner, dev]
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: production
      url: https://nl2cad.de

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy
        run: |
          set -euo pipefail

          # .env.prod lives outside git at persistent location
          cp /opt/cad-hub/.env.prod .env.prod

          echo "=== Pulling new image ==="
          docker compose -f docker-compose.prod.yml pull web

          echo "=== Starting DB + Redis ==="
          docker compose -f docker-compose.prod.yml up -d db redis
          sleep 8

          echo "=== Running migrations ==="
          docker compose -f docker-compose.prod.yml up migrate
          docker compose -f docker-compose.prod.yml rm -f migrate 2>/dev/null || true

          echo "=== Recreating web + worker ==="
          docker compose -f docker-compose.prod.yml up -d --force-recreate web worker

          echo "=== Collecting static files ==="
          sleep 8
          docker compose -f docker-compose.prod.yml exec -T web \
            python manage.py collectstatic --noinput 2>/dev/null || true

      - name: Health Check
        run: |
          sleep 10
          for i in 1 2 3; do
            HTTP=$(curl -sf -o /dev/null -w '%{http_code}' http://127.0.0.1:8094/livez/ 2>/dev/null || echo 000)
            if [[ "$HTTP" == "200" ]]; then
              echo "Health check passed (HTTP $HTTP)"
              exit 0
            fi
            echo "Attempt $i: HTTP $HTTP — retrying..."
            sleep 10
          done
          echo "Health check FAILED"
          exit 1

      - name: Cleanup old images
        if: always()
        run: docker image prune -f || true
