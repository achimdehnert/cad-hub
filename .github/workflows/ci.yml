# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║  CAD-HUB CI/CD — Platform Reusable Workflows (ADR-022, ADR-057)          ║
# ║  CI: _ci-python.yml@main (unit+integration+coverage+security)            ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

name: CI/CD Pipeline

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests (emergency only)'
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: '3.12'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/cad-hub-web

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 1: CI (Lint, Unit Tests, Integration Tests, Coverage, Security)
  # ADR-057: split test-unit / test-integration / coverage-report
  # ═══════════════════════════════════════════════════════════════════════════
  ci:
    name: "CI"
    uses: achimdehnert/platform/.github/workflows/_ci-python.yml@main
    with:
      python_version: "3.12"
      coverage_threshold: 0
      requirements_file: "requirements.txt"
      test_requirements_file: "requirements-test.txt"
      django_settings_module: "config.settings.test"
      skip_tests: ${{ inputs.skip_tests || false }}
      enable_security_scan: true
      run_contract_tests: ${{ github.ref == 'refs/heads/main' }}
    secrets: inherit

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 2: Build & Push Docker Image
  # ADR-042: Only on push to main or workflow_dispatch
  # ═══════════════════════════════════════════════════════════════════════════
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: [ci]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
