name: "Deploy"

permissions:
  contents: read
  packages: write

concurrency:
  # Je ZIEL-UMGEBUNG, nicht je Branch (platform#2229): ein Staging-Push darf
  # einen laufenden Produktions-Deploy nicht abraeumen. Realfall 2026-08-23
  # bei risk-hub — der Prod-Lauf endete als `cancelled`, also weder gruen noch
  # rot, und fiel damit durch jeden Melder.
  #
  # `inputs.target_environment` ist bei `push` leer — dieses Repo deployt bei push nach PRODUCTION (Default unten im deploy-Job, dev-hub#288):
  # zwei Staging-Laeufe kuerzen sich weiterhin gegenseitig ab. Prod bekommt eine
  # eigene Gruppe und wird nicht abgebrochen — dieselbe Wahl, die
  # `_deploy-unified.yml` fuer ihren Produktions-Job trifft.
  group: deploy-cad-hub-${{ github.ref_name }}-${{ inputs.target_environment || 'production' }}
  cancel-in-progress: ${{ (inputs.target_environment || 'production') != 'production' }}

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      image_tag_override:
        description: "Rollback auf Image-Tag (z.B. v1.2.1) — leer = auto"
        required: false
        default: ""
      target_environment:
        description: "production oder staging (default: production)"
        required: false
        default: "production"
        type: choice
        options:
          - production
          - staging

jobs:
  ci:
    uses: iilgmbh/shared-ci/.github/workflows/_ci-python.yml@v1.1.10
    if: startsWith(github.ref, 'refs/heads/')
    with:
      skip_tests: false
      django_settings_module: "config.settings.test"
      # Gleicher Host-OOM-Schutz wie in ci.yml (PR #39): v1.0.5 defaultet noch
      # auf 'auto' = 12 xdist-Worker -> memcg-Crash auf dem geteilten Runner-Host
      # (Deploy-Run 29183210419). Ab shared-ci v1.0.11 (Default '4') entbehrlich.
      pytest_workers: "4"
    secrets: inherit

  deploy:
    needs: [ci]
    if: always() && (needs.ci.result == 'success' || needs.ci.result == 'skipped')
    uses: iilgmbh/shared-ci/.github/workflows/_deploy-unified.yml@v1.1.10
    with:
      app_name: "cad-hub"
      app_path: "/opt/cad-hub"
      # Pin deploy job to the prod host's unique runner label (platform #461).
      # Generic 'self-hosted' matched BOTH prod-server and dev-hetzner → deploy
      # landed on wrong host → cp: Permission denied on /opt/cad-hub (#21).
      # 2026-08-20: Runner nach prod-b umgezogen (platform#2122) — cad-hub laeuft dort.
      # Label ist host-spezifisch, damit ein spaeter wieder auftauchender prod-a-Runner
      # den Deploy nicht zurueckziehen kann.
      deploy_runs_on: "89-167-43-30-cad-hub"
      dockerfile_path: "docker/app/Dockerfile"
      health_check_url: "https://nl2cad.de/livez/"
      image_tag_override: ${{ inputs.image_tag_override || '' }}
      target_environment: ${{ inputs.target_environment || 'production' }}
      notify_discord: true
      # Import-Smoke-Gate (platform #451): lädt Django + triggert Celery-Task-
      # Autodiscovery + Root-URLConf im frisch gebauten Image. Fängt Import-
      # Contract-Drift (z.B. nl2cad_X → nl2cad.X, #17) VOR dem Deploy — sonst
      # erst zur Laufzeit als Worker-Crash-Loop sichtbar. DB-frei (nur Imports).
      import_smoke: 'SECRET_KEY=ci-smoke DJANGO_SETTINGS_MODULE=config.settings.test python -c "import django; django.setup(); from config.celery import app; app.loader.import_default_modules(); from django.urls import get_resolver; get_resolver().url_patterns"'
    secrets: inherit