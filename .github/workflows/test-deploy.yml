name: Test Deploy Only
on:
  workflow_dispatch:

jobs:
  test-reusable:
    uses: achimdehnert/platform/.github/workflows/_test-reusable.yml@main
    with:
      app_name: "cad-hub"

  test-deploy:
    needs: [test-reusable]
    if: always()
    uses: achimdehnert/platform/.github/workflows/_deploy-unified.yml@main
    with:
      app_name: "cad-hub"
      app_path: "/opt/cad-hub"
      dockerfile_path: "docker/app/Dockerfile"
      health_check_url: "https://cad.iil.pet/healthz/"
    secrets: inherit
